# PR verification gate for changes touching recipe/sketch/rule content.
#
# This is the plan's full PR trigger: L1 + L2 + L5 plus real L3 Wokwi
# simulation. `WOKWI_CLI_TOKEN` is provisioned (docs/wokwi-setup.md) and L3 has
# been observed passing end-to-end in a real runner — see the verified run
# recorded in docs/wokwi-setup.md §5.
#
# Two L3 projects run, because a recipe's diagram must contain exactly the
# circuit its `wiring[]` describes (enforced by src/wokwi/netlist.test.ts):
#   - root project        -> the pendulum recipe as a student builds it
#   - wokwi/chip-conformance -> the INA219/TSL2591 custom-chip rig, a fixture
#
# Source of truth for each job's correctness:
#   - L1 (corpus/static check)         -> US-006 / US-013 (`npm test`)
#   - Wokwi layout + netlist gates     -> `npm run test:wokwi-layout`
#   - Firestore/Storage security rules -> US-009 (`npm run test:rules`)
#   - L2 (arduino-cli compile gate)    -> US-205 (`npm run verify:compile`)
#   - L5 (host logic + chip-register)  -> US-206 / US-207 (`npm run verify:logic`)
name: PR Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'logic/**'
      - 'chips/**'
      - 'scripts/**'
      - 'wokwi/**'
      - 'diagram.json'
      - 'diagram/**'
      - 'docs/wokwi-wiring-rules.md'
      - '.github/workflows/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'package.json'
      - 'package-lock.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Must precede `npm test`, not just `npm run verify:compile`:
      # src/verification/compileCheck.test.ts is a plain vitest file picked up
      # by `npm test` and it shells out to the real arduino-cli binary, so
      # without this step `npm test` fails before verify:compile ever runs.
      - name: Install arduino-cli + arduino:avr core (US-205 setup step)
        run: npm run setup:arduino-cli

      - name: L1 corpus/static checks (US-006/US-013 source of truth)
        run: npm test

      # Geometric layout rules AND the electrical netlist gate: every conductor
      # a layout builds must be one recipe.wiring[] declares, and vice versa.
      - name: Strict Wokwi wiring layout + netlist rules
        run: npm run test:wokwi-layout

      - name: Verify generated Wokwi diagrams are current
        run: npm run verify:wokwi-diagram

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore/Storage security rule tests (US-009 source of truth)
        run: npm run test:rules

      - name: L2 compile check — SRAM/Flash thresholds (US-205 source of truth)
        run: npm run verify:compile

      - name: L5 logic + chip-register harness (US-206/US-207 source of truth)
        run: npm run verify:logic

      - name: Install Wokwi CLI
        run: curl -L https://wokwi.com/ci/install.sh | sh

      # MUST precede `build:wokwi`: that step copies chips/*.chip.wasm into the
      # self-contained wokwi/chip-conformance project, so rebuilding the wasm
      # afterwards would leave the rig simulating the committed binaries
      # instead of the ones just built from C source.
      - name: Build INA219 and TSL2591 custom chips
        run: npm run build:wokwi:chips

      - name: Build Arduino Uno firmware + stage Wokwi project assets
        run: npm run build:wokwi

      - name: L3 Wokwi simulation — pendulum recipe
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: /
          timeout: 10000
          scenario: wokwi/pendulum.test.yaml

      # Separate project: proves the hand-written chips answer real I2C traffic
      # without wiring them into a recipe that never declared them.
      - name: L3 Wokwi simulation — custom chip conformance rig
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: wokwi/chip-conformance
          timeout: 10000
          scenario: scenario.test.yaml
