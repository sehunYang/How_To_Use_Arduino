# Build + deploy this static SPA to GitHub Pages.
#
# NOTE (plan E9): this repository must be PUBLIC. GitHub Actions gives
# public repos an unmetered minute budget; private repos are capped at
# 2000 min/month on the free tier, and this project's CI (lint + vitest +
# build + the Firestore/Storage emulator rule suite) is comprehensive
# enough to blow through that cap quickly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy_rules:
        description: >-
          Re-ship a ruleset even though this run has no diff to read.
          Leave at "none" to redeploy the site alone; the push trigger
          already ships rules whenever their source changes.
        type: choice
        default: none
        options: [none, firestore, storage, both]

# Least-privilege token, scoped up only for the Pages deployment job.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two concurrent deployments stomping on each other; let an
# in-flight deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Install arduino-cli for compile tests
        run: npm run setup:arduino-cli
      - run: npm test
      - run: npm run verify:wokwi-diagram

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore/Storage security rule tests (plan 0.5 CI gate)
        # Runs against the local Firebase emulator only (no live project,
        # no credentials) -- see firebase.json / .firebaserc. A rules
        # regression must fail this build, not be discovered later.
        run: npm run test:rules

      # These belong to the build alone. Setting them on the whole job also
      # handed them to `npm test`, where Vitest exposes any VITE_-prefixed
      # variable through `import.meta.env`. The router then took
      # /How_To_Use_Arduino as its basename while the tests navigated to /,
      # so React Router matched nothing and rendered an empty document: the
      # WCAG sweep passed on a blank page for weeks, and the one assertion
      # that demands an element be present (the skip link) failed instead.
      - run: npm run build
        env:
          # Single source of truth for emitted asset URLs and the client router.
          # shy.ai.kr exposes this project beneath the repository subpath.
          VITE_BASE_PATH: /How_To_Use_Arduino/
          # Vite only exposes variables prefixed with VITE_ to browser code.
          # The repository secrets use the shared FIREBASE_* names consumed by
          # the verification workflows, so map them explicitly for the SPA build.
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}

      - name: SPA deep-link fallback for GitHub Pages
        # GitHub Pages returns a real HTTP 404 status for any request path
        # that isn't a literal file on disk. It also serves a repo-root
        # 404.html (if present) as the body of that 404 response. Copying
        # index.html to 404.html means a hard refresh / shared link on a
        # client-side route (e.g. /some/deep/path) still gets the SPA's
        # JS + router in the response body, which then resolves the route
        # client-side instead of showing a bare GitHub 404 page.
        run: cp dist/index.html dist/404.html

      - name: Verify SPA fallback artifact
        # Automated check (scripts/verify-spa-fallback.mjs) that dist/404.html
        # exists and is byte-identical to dist/index.html, so a future
        # refactor of this workflow can't silently drop the copy step.
        run: npm run verify:spa-fallback

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Ships firestore.rules / storage.rules to the live project. Until this job
  # existed, nothing did: `test:rules` above proves a ruleset against the local
  # emulator, which says nothing about what the real project is enforcing. The
  # gap was not theoretical -- a stats read the emulator suite never asserted
  # shipped as isAdmin()-only, and Daily Verification died on permission-denied
  # for 27 consecutive nights before the fix was deployed by hand.
  deploy-rules:
    needs: build
    runs-on: ubuntu-latest
    env:
      # A job-level `if:` cannot read the secrets context, so the presence
      # check is hoisted into an env var the steps below can branch on.
      HAS_DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate below diffs against the base of the push, which is not
          # reachable at the default fetch depth of 1.
          fetch-depth: 0

      - name: Decide which rulesets this run should ship
        id: changed
        # Every deploy mints a ruleset version against a per-project cap of
        # 2500, so this does not fire on pushes that leave the rules alone.
        # Gating per file also keeps storage.rules from going out as a side
        # effect of an unrelated change -- it ships when someone edits it, or
        # when a human asks for it by name above.
        env:
          MANUAL: ${{ inputs.redeploy_rules }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            case "$MANUAL" in
              firestore) targets='firestore:rules' ;;
              storage)   targets='storage' ;;
              both)      targets='firestore:rules,storage' ;;
              *)         targets='' ;;
            esac
          else
            base='${{ github.event.before }}'
            list="$RUNNER_TEMP/changed-paths.txt"
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only "$base" '${{ github.sha }}' > "$list"
            else
              # A base commit absent from this clone (first push on a branch,
              # force-push). With no diff to read, converge the live project on
              # what the repository declares rather than skip the deploy.
              printf 'firestore.rules\nstorage.rules\n' > "$list"
            fi

            targets=''
            # firebase.json decides which file feeds which target, so a change
            # there can redirect a deploy without either .rules file moving.
            if grep -qxE 'firestore\.rules|firebase\.json' "$list"; then
              targets='firestore:rules'
            fi
            if grep -qxE 'storage\.rules|firebase\.json' "$list"; then
              targets="${targets:+$targets,}storage"
            fi
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ -n "$targets" ]; then
            echo "Will deploy: $targets"
          else
            echo 'No ruleset to deploy in this run.'
          fi

      - name: Refuse to leave changed rules undeployed
        # The failure this job exists to prevent is a rule change that is green
        # in CI and absent from production. Skipping quietly when the
        # credential is missing would rebuild exactly that gap, so a rules
        # change with no way to ship it is a hard stop.
        if: steps.changed.outputs.targets != '' && env.HAS_DEPLOY_CREDENTIALS != 'true'
        run: |
          echo "::error::${{ steps.changed.outputs.targets }} changed in this push, but the FIREBASE_SERVICE_ACCOUNT secret is not set, so the new rules cannot reach the live project. Add that secret (a service account key holding the Firebase Rules Admin role), or deploy by hand: npx firebase deploy --only ${{ steps.changed.outputs.targets }} -P <project-id>"
          exit 1

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.targets != '' && env.HAS_DEPLOY_CREDENTIALS == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install the pinned firebase-tools
        # The lockfile's CLI rather than a floating firebase-tools@latest: the
        # tool that ships the rules should be the one `test:rules` just
        # validated them with.
        if: steps.changed.outputs.targets != '' && env.HAS_DEPLOY_CREDENTIALS == 'true'
        run: npm ci

      - name: Deploy rules to the live project
        # -P is not optional. .firebaserc's default project is
        # how-to-use-arduino-test, which the emulator suite depends on, so a
        # deploy without an explicit project quietly lands on the test project
        # while production keeps the old rules.
        if: steps.changed.outputs.targets != '' && env.HAS_DEPLOY_CREDENTIALS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TARGETS: ${{ steps.changed.outputs.targets }}
        run: |
          creds="$RUNNER_TEMP/firebase-service-account.json"
          # Written with a restrictive umask and removed on the way out; the
          # runner is ephemeral but the key outlives the job.
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds")
          trap 'rm -f "$creds"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
            npx firebase deploy --only "$TARGETS" -P "$FIREBASE_PROJECT_ID" --non-interactive

  deploy:
    # Rules go out before the SPA does. The client is what has to satisfy them,
    # so shipping new client code against the old ruleset is the ordering that
    # breaks; the reverse merely opens a permission a little early.
    needs: [build, deploy-rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
