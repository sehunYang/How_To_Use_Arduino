# E3 pre-publish queue drain. The executable path is complete, but this
# workflow remains manual until its four repository secrets are provisioned
# and one workflow_dispatch run succeeds. Then the 15-minute schedule can be
# enabled without changing the implementation.
#
# Required secrets:
#   FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_APP_ID,
#   FIREBASE_CI_EMAIL, FIREBASE_CI_PASSWORD,
#   FIREBASE_APPCHECK_DEBUG_TOKEN
#
# The Firebase Auth user must carry the `ci:true` custom claim. The script uses
# the client SDK, not an Admin service-account key, so live Firestore rules stay
# enforced exactly as the plan requires.
name: Verify Queue Drain

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install arduino-cli + arduino:avr core
        run: npm run setup:arduino-cli

      - name: Drain verifyRequests queue
        run: npm run verify:queue
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CI_EMAIL: ${{ secrets.FIREBASE_CI_EMAIL }}
          FIREBASE_CI_PASSWORD: ${{ secrets.FIREBASE_CI_PASSWORD }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
