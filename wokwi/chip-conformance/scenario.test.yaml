# Custom chip conformance: proves the INA219, TSL2591, and BME280 chips answer
# real I2C register traffic, including controls changed mid-simulation.
name: INA219, TSL2591, and BME280 custom chip conformance
version: 1
author: sehunYang
steps:
  - wait-serial: "WOKWI_READY"
  # Initial register reads matched, including BME280 identity, calibration, and
  # all three raw measurement channels.
  - wait-serial: "CUSTOM_CHIPS_OK"
  - set-control:
      part-id: tsl2591
      control: ch0Raw
      value: 2048
  - wait-serial: "TSL_CH0=2048"
  - set-control:
      part-id: bme280
      control: temperatureRaw
      value: 400000
  - wait-serial: "BME_TEMP_RAW=400000"
