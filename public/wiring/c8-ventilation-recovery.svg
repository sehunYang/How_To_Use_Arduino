<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">환기 전후 실내 회복 시간 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. BME280.VIN → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 VIN 단자</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. BME280.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 GND 단자</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. BME280.SDA → UNO.A4</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 SDA 단자</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. BME280.SCL → UNO.A5</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 SCL 단자</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. RELAY.IN → UNO.D7</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈의 IN을 D7에 연결하세요.</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. RELAY.VCC → UNO.5V</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈의 VCC를 아두이노 5V에 연결</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. RELAY.GND → UNO.GND</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈의 GND를 아두이노 GND에 연</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. FAN_SUPPLY.+ → RELAY.COM</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">팬 정격에 맞는 별도 5V 전원의 + 단자를</text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. RELAY.NO → FAN.POSITIVE</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">릴레이 NO를 팬의 + 선에 연결하세요. 릴</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. FAN.NEGATIVE → FAN_SUPPLY.-</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">팬의 - 선을 별도 전원의 - 단자에 연결해</text>
</g>
</svg>
