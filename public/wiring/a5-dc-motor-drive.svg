<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">DC모터 속도와 방향 바꾸기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. DRIVER.IN1 → UNO.D2</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">모터 드라이버의 IN1을 D2에 연결하세요.</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. DRIVER.IN2 → UNO.D4</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">모터 드라이버의 IN2를 D4에 연결하세요.</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. DRIVER.ENA → UNO.D5</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">속도를 정하는 ENA를 D5에 연결하세요.</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. BATTERY.+ → DRIVER.VM</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">모터 정격에 맞는 별도 전원의 + 단자를 드</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. BATTERY.- → DRIVER.GND</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">별도 전원의 - 단자를 드라이버 GND에 연</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. DRIVER.GND → UNO.GND</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">드라이버 GND와 아두이노 GND를 공통으로</text>
</g>
</svg>
