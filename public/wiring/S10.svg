<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">HBE0704로 자기장 세기와 극성 읽기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. HBE0704.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">모듈 사양을 확인한 뒤 VCC를 5V에 연결</text>
</g>
<g>
  <rect x="215" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="225" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. HBE0704.GND → UNO.GND</text>
  <text x="225" y="77" font-family="sans-serif" font-size="11" fill="#455064">GND를 아두이노 GND에 연결하세요.</text>
</g>
<g>
  <rect x="400" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="410" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. HBE0704.OUT → UNO.A0</text>
  <text x="410" y="77" font-family="sans-serif" font-size="11" fill="#455064">아날로그 출력 OUT을 A0에 연결하세요.</text>
</g>
</svg>
