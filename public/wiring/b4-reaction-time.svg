<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">사람의 반응 시간 측정 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. RESISTOR_220.1 → UNO.D9</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">220 Ω 저항의 한쪽 다리를 D9에 연결하</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. LED.ANODE → RESISTOR_220.2</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">LED의 긴 다리(양극)를 220 Ω 저항의</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. LED.CATHODE → UNO.GND</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">LED의 짧은 다리(음극)를 GND에 연결하</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. HC-SR04.VCC → UNO.5V</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">초음파 거리 센서의 VCC를 아두이노 5V에</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. HC-SR04.GND → UNO.GND</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">초음파 거리 센서의 GND를 아두이노 GND</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. HC-SR04.TRIG → UNO.D7</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">초음파를 내보내라고 시키는 TRIG를 D7에</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. HC-SR04.ECHO → UNO.D6</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">돌아온 소리를 알려 주는 ECHO를 D6에 </text>
</g>
</svg>
