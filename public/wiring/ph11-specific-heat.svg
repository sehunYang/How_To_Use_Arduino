<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">물질의 비열 비교 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. DS18B20_1.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_1 VCC를 브레드보드 + 전</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. DS18B20_1.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_1 GND를 브레드보드 - 전</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. DS18B20_1.DATA → UNO.D2</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_1 DATA를 UNO D2 공</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. DS18B20_2.VCC → UNO.5V</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_2 VCC를 브레드보드 + 전</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. DS18B20_2.GND → UNO.GND</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_2 GND를 브레드보드 - 전</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. DS18B20_2.DATA → DS18B20_1.DATA</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_2 DATA를 첫 DS18B2</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. DS18B20_1.DATA → RESISTOR_4700.1</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_1 DATA와 신호선을 기본 </text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. RESISTOR_4700.2 → UNO.5V</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">신호선을 기본 HIGH 상태로 유지하는 4.</text>
</g>
</svg>
