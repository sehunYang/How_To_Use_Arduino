  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_2 GND를 아두이노 GND에</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
