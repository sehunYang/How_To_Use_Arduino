  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">DS18B20_1 VCC를 아두이노 5V에 </text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
