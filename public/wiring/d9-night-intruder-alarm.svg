<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">어두울 때 다가오면 울리는 자동 방범 장치 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. CDS.L1 → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">CDS의 한쪽 다리를 5V에 연결하세요. C</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. CDS.L2 → UNO.A0</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">CDS의 남은 다리를 A0에 연결하세요. 이</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. CDS.L2 → CDS_RESISTOR.1</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">같은 열에 10 kΩ 저항의 한쪽 다리를 함</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. CDS_RESISTOR.2 → UNO.GND</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">10 kΩ 저항의 남은 다리를 GND에 연결</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. HC-SR04.VCC → UNO.5V</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">초음파 거리 센서의 VCC를 아두이노 5V에</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. HC-SR04.GND → UNO.GND</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">초음파 거리 센서의 GND를 아두이노 GND</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. HC-SR04.TRIG → UNO.D7</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">초음파를 내보내라고 시키는 TRIG를 D7에</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. HC-SR04.ECHO → UNO.D6</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">돌아온 소리를 알려 주는 ECHO를 D6에 </text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. BUZZER.SIGNAL → UNO.D8</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">부저의 신호선(+ 표시가 있는 쪽)을 D8에</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. BUZZER.GND → UNO.GND</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">부저의 남은 다리를 GND에 연결하세요.</text>
</g>
</svg>
