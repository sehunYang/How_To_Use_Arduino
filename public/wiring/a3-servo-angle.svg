<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">서보모터에 각도 지시하기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. SERVO.SIGNAL → UNO.D9</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">서보의 주황색 신호선을 D9에 연결하세요.</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. SERVO.VCC → SERVO_SUPPLY.+</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">서보의 빨간 선을 별도 5V 전원의 + 단자</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. SERVO.GND → SERVO_SUPPLY.-</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">서보의 갈색 선을 별도 전원의 - 단자에 연</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. SERVO_SUPPLY.- → UNO.GND</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">별도 전원의 - 단자를 아두이노 GND와 공</text>
</g>
</svg>
