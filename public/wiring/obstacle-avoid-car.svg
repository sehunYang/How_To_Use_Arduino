<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">장애물 회피 자율주행 자동차 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. MPU6050.VCC → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">MPU6050 VCC를 아두이노 5V에 연결</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. MPU6050.GND → UNO.GND</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">MPU6050 GND를 아두이노 GND에 연</text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. MPU6050.SDA → UNO.A4</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">MPU6050 SDA를 아두이노 A4에 연결</text>
</g>
<g>
  <rect x="610" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. MPU6050.SCL → UNO.A5</text>
  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">MPU6050 SCL을 아두이노 A5에 연결</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. HC-SR04.VCC → UNO.5V</text>
  <text x="50" y="187" font-family="sans-serif" font-size="11" fill="#455064">초음파 센서 VCC를 5V에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. HC-SR04.GND → UNO.GND</text>
  <text x="240" y="187" font-family="sans-serif" font-size="11" fill="#455064">초음파 센서 GND를 공통 GND에 연결하세</text>
</g>
<g>
  <rect x="420" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="430" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. HC-SR04.TRIG → UNO.D8</text>
  <text x="430" y="187" font-family="sans-serif" font-size="11" fill="#455064">TRIG를 D8에 연결하세요.</text>
</g>
<g>
  <rect x="610" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="620" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. HC-SR04.ECHO → UNO.D9</text>
  <text x="620" y="187" font-family="sans-serif" font-size="11" fill="#455064">ECHO를 D9에 연결하세요.</text>
</g>
<g>
  <rect x="40" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="50" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. DRIVER.IN1 → UNO.D2</text>
  <text x="50" y="292" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 모터 방향 입력을 D2에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="240" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. DRIVER.IN2 → UNO.D3</text>
  <text x="240" y="292" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 모터 방향 입력을 D3에 연결하세요.</text>
</g>
<g>
  <rect x="420" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="430" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">11. DRIVER.ENA → UNO.D5</text>
  <text x="430" y="292" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 모터 PWM 입력을 D5에 연결하세요.</text>
</g>
<g>
  <rect x="610" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="white" stroke-width="4"/>
  <text x="620" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">12. DRIVER.ENB → UNO.D6</text>
  <text x="620" y="292" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 모터 PWM 입력을 D6에 연결하세요</text>
</g>
<g>
  <rect x="40" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">13. BATTERY.+ → DRIVER.VM</text>
  <text x="50" y="397" font-family="sans-serif" font-size="11" fill="#455064">모터 정격에 맞는 외부 전원 양극을 드라이버</text>
</g>
<g>
  <rect x="230" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">14. BATTERY.- → DRIVER.GND</text>
  <text x="240" y="397" font-family="sans-serif" font-size="11" fill="#455064">외부 전원 음극을 드라이버 GND에 연결하세</text>
</g>
<g>
  <rect x="420" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="430" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">15. DRIVER.GND → UNO.GND</text>
  <text x="430" y="397" font-family="sans-serif" font-size="11" fill="#455064">드라이버와 Uno의 GND를 공통으로 연결하</text>
</g>
</svg>
