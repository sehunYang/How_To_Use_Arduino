<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">HC-SR04 초음파로 거리 재기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. HC-SR04.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">VCC를 아두이노 5V에 연결하세요.</text>
</g>
<g>
  <rect x="215" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="225" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. HC-SR04.GND → UNO.GND</text>
  <text x="225" y="77" font-family="sans-serif" font-size="11" fill="#455064">GND를 아두이노 GND에 연결하세요.</text>
</g>
<g>
  <rect x="400" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="410" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. HC-SR04.TRIG → UNO.D7</text>
  <text x="410" y="77" font-family="sans-serif" font-size="11" fill="#455064">TRIG를 디지털 7번 핀에 연결하세요.</text>
</g>
<g>
  <rect x="585" y="30" width="150" height="60" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="595" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. HC-SR04.ECHO → UNO.D6</text>
  <text x="595" y="77" font-family="sans-serif" font-size="11" fill="#455064">ECHO를 디지털 6번 핀에 연결하세요.</text>
</g>
</svg>
