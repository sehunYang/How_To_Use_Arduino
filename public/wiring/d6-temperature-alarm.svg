<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">온도 경보기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. DS18B20.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">온도 프로브의 빨간 선을 아두이노 5V에 연</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. DS18B20.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">온도 프로브의 검은 선을 아두이노 GND에 </text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. DS18B20.DATA → UNO.D4</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">온도 프로브의 노란 선(DATA)을 D4에 </text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. DS18B20.DATA → RESISTOR_4700.1</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">신호선과 4.7 kΩ 저항의 한쪽 다리를 같</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. RESISTOR_4700.2 → UNO.5V</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">4.7 kΩ 저항의 남은 다리를 5V에 연결</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. BUZZER.SIGNAL → UNO.D8</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">부저의 신호선(+ 표시가 있는 쪽)을 D8에</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. BUZZER.GND → UNO.GND</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">부저의 남은 다리를 GND에 연결하세요.</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. RESISTOR_220.1 → UNO.D9</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">220 Ω 저항의 한쪽 다리를 D9에 연결하</text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. LED.ANODE → RESISTOR_220.2</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">LED의 긴 다리(양극)를 220 Ω 저항의</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. LED.CATHODE → UNO.GND</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">LED의 짧은 다리(음극)를 GND에 연결하</text>
</g>
</svg>
