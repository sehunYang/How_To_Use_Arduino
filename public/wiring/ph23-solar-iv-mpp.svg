<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">태양전지 I-V 곡선과 최대전력점 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. INA219.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 VCC를 UNO 5V에 연결하세</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. INA219.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 GND를 UNO GND에 연결하</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. INA219.SDA → UNO.A4</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 SDA를 UNO A4 공통 I2</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. INA219.SCL → UNO.A5</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 SCL을 UNO A5 공통 I2</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. TSL2591.VIN → UNO.5V</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 VIN을 UNO 5V에 연결하</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. TSL2591.GND → UNO.GND</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 GND를 UNO GND에 연결</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. TSL2591.SDA → UNO.A4</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 SDA를 UNO A4 공통 I</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. TSL2591.SCL → UNO.A5</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 SCL을 UNO A5 공통 I</text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. PANEL.POSITIVE → INA219.VIN+</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">태양전지 +를 INA219 VIN+에 연결하</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. INA219.VIN- → RESISTOR_1000.1</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">기본 LOAD_1K 조건에서 INA219 V</text>
</g>
<g>
  <rect x="30" y="240" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="40" y="265" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">11. RESISTOR_1000.2 → PANEL.NEGATIVE</text>
  <text x="40" y="287" font-family="sans-serif" font-size="11" fill="#455064">1 kΩ 부하 2번 다리를 태양전지 -에 연</text>
</g>
<g>
  <rect x="220" y="240" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="265" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">12. PANEL.NEGATIVE → UNO.GND</text>
  <text x="230" y="287" font-family="sans-serif" font-size="11" fill="#455064">태양전지 -와 UNO GND를 공통 접지해 </text>
</g>
</svg>
