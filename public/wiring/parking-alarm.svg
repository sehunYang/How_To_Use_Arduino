<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">주차 보조 거리 경보기 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. HC-SR04.VCC → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">HC-SR04 VCC를 5V에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. HC-SR04.GND → UNO.GND</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">HC-SR04 GND를 공통 GND에 연결하</text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. HC-SR04.TRIG → UNO.D8</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">TRIG를 D8에 연결하세요.</text>
</g>
<g>
  <rect x="610" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. HC-SR04.ECHO → UNO.D9</text>
  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">ECHO를 D9에 연결하세요.</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="50" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. BUZZER.SIGNAL → UNO.D3</text>
  <text x="50" y="187" font-family="sans-serif" font-size="11" fill="#455064">부저 신호선을 D3에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. BUZZER.GND → UNO.GND</text>
  <text x="240" y="187" font-family="sans-serif" font-size="11" fill="#455064">부저 GND를 공통 GND에 연결하세요.</text>
</g>
<g>
  <rect x="420" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="430" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. LED.ANODE → UNO.D4</text>
  <text x="430" y="187" font-family="sans-serif" font-size="11" fill="#455064">LED 양극을 220 Ω 저항을 거쳐 D4에</text>
</g>
<g>
  <rect x="610" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="620" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. LED.CATHODE → UNO.GND</text>
  <text x="620" y="187" font-family="sans-serif" font-size="11" fill="#455064">LED 음극을 GND에 연결하세요.</text>
</g>
</svg>
