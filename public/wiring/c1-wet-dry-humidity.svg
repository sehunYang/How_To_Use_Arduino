<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">건구·습구 온도로 상대습도 구하기 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. BME280.VIN → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 VIN 단자</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. BME280.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 GND 단자</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. BME280.SDA → UNO.A4</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 SDA 단자</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. BME280.SCL → UNO.A5</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">BME280 온습도·기압 센서의 SCL 단자</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. DS18B20_1.VCC → UNO.5V</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">1번 온도 프로브의 빨간 선을 아두이노 5V</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. DS18B20_1.GND → UNO.GND</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">1번 온도 프로브의 검은 선을 아두이노 GN</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. DS18B20_1.DATA → UNO.D4</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">1번 온도 프로브의 노란 선(DATA)을 D</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. DS18B20_2.VCC → UNO.5V</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">2번 온도 프로브의 빨간 선을 아두이노 5V</text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. DS18B20_2.GND → UNO.GND</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">2번 온도 프로브의 검은 선을 아두이노 GN</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. DS18B20_2.DATA → DS18B20_1.DATA</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">2번 온도 프로브의 노란 선을 1번 프로브의</text>
</g>
<g>
  <rect x="30" y="240" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="40" y="265" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">11. DS18B20_1.DATA → RESISTOR_4700.1</text>
  <text x="40" y="287" font-family="sans-serif" font-size="11" fill="#455064">신호선과 4.7 kΩ 저항의 한쪽 다리를 같</text>
</g>
<g>
  <rect x="220" y="240" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="230" y="265" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">12. RESISTOR_4700.2 → UNO.5V</text>
  <text x="230" y="287" font-family="sans-serif" font-size="11" fill="#455064">4.7 kΩ 저항의 남은 다리를 5V에 연결</text>
</g>
</svg>
