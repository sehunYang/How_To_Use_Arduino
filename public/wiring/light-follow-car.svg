<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">빛을 따라가는 자동차 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. CDS_1.L1 → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 CDS의 L1을 5V에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. CDS_1.L2 → CDS_RESISTOR_1.1</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 CDS의 L2를 왼쪽 10 kΩ 분압 </text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. CDS_RESISTOR_1.1 → UNO.A0</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 두 저항 사이의 전압 측정 지점을 A0</text>
</g>
<g>
  <rect x="610" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. CDS_RESISTOR_1.2 → UNO.GND</text>
  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 분압 저항의 다른 쪽을 GND에 연결하</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. CDS_2.L1 → UNO.5V</text>
  <text x="50" y="187" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 CDS의 L1을 5V에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="240" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. CDS_2.L2 → CDS_RESISTOR_2.1</text>
  <text x="240" y="187" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 CDS의 L2를 오른쪽 10 kΩ 분</text>
</g>
<g>
  <rect x="420" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. CDS_RESISTOR_2.1 → UNO.A1</text>
  <text x="430" y="187" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 두 저항 사이의 전압 측정 지점을 A</text>
</g>
<g>
  <rect x="610" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="620" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. CDS_RESISTOR_2.2 → UNO.GND</text>
  <text x="620" y="187" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 분압 저항의 다른 쪽을 GND에 연결</text>
</g>
<g>
  <rect x="40" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="50" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. DRIVER.IN1 → UNO.D2</text>
  <text x="50" y="292" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 모터 방향 입력 IN1을 D2에 연결하</text>
</g>
<g>
  <rect x="230" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="240" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. DRIVER.IN2 → UNO.D4</text>
  <text x="240" y="292" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 모터 방향 입력 IN2를 D4에 연결하</text>
</g>
<g>
  <rect x="420" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="430" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">11. DRIVER.IN3 → UNO.D3</text>
  <text x="430" y="292" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 모터 방향 입력 IN3을 D3에 연결</text>
</g>
<g>
  <rect x="610" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="620" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">12. DRIVER.IN4 → UNO.D7</text>
  <text x="620" y="292" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 모터 방향 입력 IN4를 D7에 연결</text>
</g>
<g>
  <rect x="40" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="50" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">13. DRIVER.ENA → UNO.D5</text>
  <text x="50" y="397" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 PWM(ENA)을 D5에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="white" stroke-width="4"/>
  <text x="240" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">14. DRIVER.ENB → UNO.D6</text>
  <text x="240" y="397" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 PWM(ENB)을 D6에 연결하세요.</text>
</g>
<g>
  <rect x="420" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="430" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">15. BATTERY.+ → DRIVER.VM</text>
  <text x="430" y="397" font-family="sans-serif" font-size="11" fill="#455064">모터용 외부 전원 양극을 드라이버 VM에 연</text>
</g>
<g>
  <rect x="610" y="350" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="620" y="375" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">16. BATTERY.- → DRIVER.GND</text>
  <text x="620" y="397" font-family="sans-serif" font-size="11" fill="#455064">외부 전원 음극을 드라이버 GND에 연결하세</text>
</g>
<g>
  <rect x="40" y="455" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="50" y="480" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">17. DRIVER.GND → UNO.GND</text>
  <text x="50" y="502" font-family="sans-serif" font-size="11" fill="#455064">드라이버와 Uno의 GND를 공통으로 연결하</text>
</g>
</svg>
