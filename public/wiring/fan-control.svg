<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">온습도에 따른 자동 환풍기 제어 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. BME280.VCC → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">5V 입력을 지원하는 BME280 모듈의 V</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. BME280.GND → UNO.GND</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">BME280 GND를 아두이노 GND에 연결</text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. BME280.SDA → UNO.A4</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">BME280 SDA를 아두이노 A4에 연결하</text>
</g>
<g>
  <rect x="610" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. BME280.SCL → UNO.A5</text>
  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">BME280 SCL을 아두이노 A5에 연결하</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="50" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. RELAY.IN → UNO.D7</text>
  <text x="50" y="187" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈 IN을 아두이노 D7에 연결하세</text>
</g>
<g>
  <rect x="230" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="240" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. RELAY.VCC → UNO.5V</text>
  <text x="240" y="187" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈 VCC를 아두이노 5V에 연결하</text>
</g>
<g>
  <rect x="420" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="430" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. RELAY.GND → UNO.GND</text>
  <text x="430" y="187" font-family="sans-serif" font-size="11" fill="#455064">릴레이 모듈 GND를 아두이노 GND에 연결</text>
</g>
<g>
  <rect x="610" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="620" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. FAN_SUPPLY.+ → RELAY.COM</text>
  <text x="620" y="187" font-family="sans-serif" font-size="11" fill="#455064">팬 정격에 맞는 별도 5V 전원의 양극을 릴</text>
</g>
<g>
  <rect x="40" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="50" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. RELAY.NO → FAN.POSITIVE</text>
  <text x="50" y="292" font-family="sans-serif" font-size="11" fill="#455064">릴레이 NO 단자를 팬의 양극에 연결하세요.</text>
</g>
<g>
  <rect x="230" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. FAN.NEGATIVE → FAN_SUPPLY.-</text>
  <text x="240" y="292" font-family="sans-serif" font-size="11" fill="#455064">팬의 음극을 별도 전원의 음극에 연결해 접점</text>
</g>
</svg>
