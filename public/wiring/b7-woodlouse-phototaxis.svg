<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">쥐며느리의 주광성 (밝기 구배 상자) · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. CDS_1.L1 → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 CDS의 한쪽 다리를 5V에 연결하세요</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. CDS_1.L2 → UNO.A0</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 CDS의 남은 다리를 A0에 연결하세요</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. CDS_1.L2 → CDS_RESISTOR_1.1</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">같은 열에 10 kΩ 저항의 한쪽 다리를 함</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. CDS_RESISTOR_1.2 → UNO.GND</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">왼쪽 쪽 10 kΩ 저항의 남은 다리를 GN</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. CDS_2.L1 → UNO.5V</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 CDS의 한쪽 다리를 5V에 연결하세</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. CDS_2.L2 → UNO.A1</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 CDS의 남은 다리를 A1에 연결하세</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="blue" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. CDS_2.L2 → CDS_RESISTOR_2.1</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">같은 열에 10 kΩ 저항의 한쪽 다리를 함</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. CDS_RESISTOR_2.2 → UNO.GND</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">오른쪽 쪽 10 kΩ 저항의 남은 다리를 G</text>
</g>
</svg>
