<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">태양광 패널 각도별 효율 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. INA219.VCC → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">INA219 VCC를 아두이노 5V에 연결하</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. INA219.GND → UNO.GND</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">INA219 GND를 아두이노 GND에 연결</text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. INA219.SDA → UNO.A4</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">INA219 SDA를 아두이노 A4에 연결하</text>
</g>
<g>
  <rect x="610" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="620" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. INA219.SCL → UNO.A5</text>
  <text x="620" y="82" font-family="sans-serif" font-size="11" fill="#455064">INA219 SCL을 아두이노 A5에 연결하</text>
</g>
<g>
  <rect x="40" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. TSL2591.VIN → UNO.5V</text>
  <text x="50" y="187" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 VIN을 아두이노 5V에 연결</text>
</g>
<g>
  <rect x="230" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. TSL2591.GND → UNO.GND</text>
  <text x="240" y="187" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 GND를 아두이노 GND에 연</text>
</g>
<g>
  <rect x="420" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. TSL2591.SDA → UNO.A4</text>
  <text x="430" y="187" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 SDA를 아두이노 A4 I2C</text>
</g>
<g>
  <rect x="610" y="140" width="150" height="70" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="620" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. TSL2591.SCL → UNO.A5</text>
  <text x="620" y="187" font-family="sans-serif" font-size="11" fill="#455064">TSL2591 SCL을 아두이노 A5 I2C</text>
</g>
<g>
  <rect x="40" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="50" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. PANEL.POSITIVE → INA219.VIN+</text>
  <text x="50" y="292" font-family="sans-serif" font-size="11" fill="#455064">태양광 패널 양극을 INA219 VIN+에 </text>
</g>
<g>
  <rect x="230" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="240" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. INA219.VIN- → LOAD.POSITIVE</text>
  <text x="240" y="292" font-family="sans-serif" font-size="11" fill="#455064">INA219 VIN-를 실험용 부하의 양극에</text>
</g>
<g>
  <rect x="420" y="245" width="150" height="70" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="430" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">11. LOAD.NEGATIVE → PANEL.NEGATIVE</text>
  <text x="430" y="292" font-family="sans-serif" font-size="11" fill="#455064">부하 음극을 패널 음극에 연결해 패널→VIN</text>
</g>
</svg>
