<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">옴의 법칙 V-I 특성 · 배선 단계 카드</text>
<g>
  <rect x="30" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. INA219.VCC → UNO.5V</text>
  <text x="40" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 VCC를 브레드보드 + 전원 레</text>
</g>
<g>
  <rect x="220" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="230" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. INA219.GND → UNO.GND</text>
  <text x="230" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 GND를 브레드보드 - 전원 레</text>
</g>
<g>
  <rect x="410" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="420" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. INA219.SDA → UNO.A4</text>
  <text x="420" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 SDA를 UNO A4(SDA)에</text>
</g>
<g>
  <rect x="600" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="yellow" stroke-width="4"/>
  <text x="610" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">4. INA219.SCL → UNO.A5</text>
  <text x="610" y="77" font-family="sans-serif" font-size="11" fill="#455064">INA219 SCL을 UNO A5(SCL)에</text>
</g>
<g>
  <rect x="790" y="30" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="800" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">5. RESISTOR_100.1 → UNO.D9</text>
  <text x="800" y="77" font-family="sans-serif" font-size="11" fill="#455064">브레드보드에 꽂은 100 Ω RC 필터 저항</text>
</g>
<g>
  <rect x="30" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="orange" stroke-width="4"/>
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">6. RESISTOR_100.2 → CAPACITOR.1</text>
  <text x="40" y="182" font-family="sans-serif" font-size="11" fill="#455064">100 Ω 저항 2번 다리와 470 µF 커</text>
</g>
<g>
  <rect x="220" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="230" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">7. RESISTOR_100.2 → INA219.VIN+</text>
  <text x="230" y="182" font-family="sans-serif" font-size="11" fill="#455064">평활 노드가 있는 브레드보드 단자 열을 IN</text>
</g>
<g>
  <rect x="410" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="420" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">8. CAPACITOR.2 → UNO.GND</text>
  <text x="420" y="182" font-family="sans-serif" font-size="11" fill="#455064">470 µF 커패시터 -극을 브레드보드 - </text>
</g>
<g>
  <rect x="600" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="purple" stroke-width="4"/>
  <text x="610" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">9. INA219.VIN- → RESISTOR_1000.1</text>
  <text x="610" y="182" font-family="sans-serif" font-size="11" fill="#455064">INA219 VIN-를 브레드보드에 꽂은 1</text>
</g>
<g>
  <rect x="790" y="135" width="165" height="78" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="800" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">10. RESISTOR_1000.2 → UNO.GND</text>
  <text x="800" y="182" font-family="sans-serif" font-size="11" fill="#455064">1 kΩ 측정 저항 2번 다리를 브레드보드 </text>
</g>
</svg>
