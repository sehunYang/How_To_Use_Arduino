<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="30" y="585" font-family="sans-serif" font-size="14" fill="#172033">발열·흡열 반응의 온도 변화 기록 · 배선 단계 카드</text>
<g>
  <rect x="40" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="red" stroke-width="4"/>
  <text x="50" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">1. DS18B20.VCC → UNO.5V</text>
  <text x="50" y="82" font-family="sans-serif" font-size="11" fill="#455064">DS18B20 VCC를 아두이노 5V에 연결</text>
</g>
<g>
  <rect x="230" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="black" stroke-width="4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">2. DS18B20.GND → UNO.GND</text>
  <text x="240" y="82" font-family="sans-serif" font-size="11" fill="#455064">DS18B20 GND를 아두이노 GND에 연</text>
</g>
<g>
  <rect x="420" y="35" width="150" height="70" rx="8" fill="#ffffff" stroke="green" stroke-width="4"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" font-weight="700" fill="#172033">3. DS18B20.DATA → UNO.D2</text>
  <text x="430" y="82" font-family="sans-serif" font-size="11" fill="#455064">모든 DS18B20 DATA를 D2에 함께 </text>
</g>
</svg>
